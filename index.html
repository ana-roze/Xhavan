<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xhavan - Home</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="container">
            <div class="header-content">
                <div class="logo">
                    <h1>🎬 Xhavan</h1>
                </div>
                <div class="search-bar">
                    <input type="text" id="searchInput" placeholder="Search videos...">
                    <button id="searchBtn"></button>
                </div>
            </div>
        </div>
    </header>

    <!-- Header Ad Banner -->
    <div class="ad-banner header-ad">
        <div class="container">
            <div id="headerAd" class="ad-placeholder">
                <!-- Ad will be loaded here -->
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <main class="main-content">
        <div class="container">
            <!-- Category Filters -->
            <div class="filters">
                <button class="filter-btn active" data-category="all">All</button>
                <button class="filter-btn" data-category="western">Western</button>
                <button class="filter-btn" data-category="asian">Asian</button>
                <button class="filter-btn" data-category="tech">Technology</button>
                <button class="filter-btn" data-category="vlogs">Vlogs</button>
            </div>

            <!-- Sort Options -->
            <div class="sort-options">
                <label>Sort by:</label>
                <select id="sortSelect">
                    <option value="newest">Newest First</option>
                    <option value="popular">Most Popular</option>
                    <option value="az">A-Z</option>
                </select>
            </div>

            <!-- Video Grid -->
            <div id="videoGrid" class="video-grid">
                <!-- Videos will be loaded here dynamically -->
                <div class="loading">Loading videos...</div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <p>&copy; 2026 Xhavan. All rights reserved.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="script.js"></script>
</body>
</html>
