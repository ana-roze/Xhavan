<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watch Video</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="container">
            <div class="header-content">
                <div class="logo">
                    <a href="index.html"><h1>🎬 Video Gallery</h1></a>
                </div>
                <div class="search-bar">
                    <input type="text" id="searchInput" placeholder="Search videos...">
                    <button id="searchBtn">🔍</button>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="video-page">
        <div class="container">
            <div class="video-layout">
                <!-- Video Player Section -->
                <div class="video-main">
                    <div id="videoPlayer" class="video-player">
                        <!-- Video will be loaded here -->
                        <div class="loading">Loading video...</div>
                    </div>

                    <!-- Video Details -->
                    <div class="video-details">
                        <h1 id="videoTitle" class="video-title">Video Title</h1>
                        <div class="video-meta">
                            <span id="videoViews" class="views">👁️ 0 views</span>
                            <span id="videoDate" class="date">📅 Date</span>
                        </div>
                        <div id="videoDescription" class="video-description">
                            <!-- Description will be loaded here -->
                        </div>
                    </div>

                    <!-- Comments Section -->
                    <div class="comments-section">
                        <h2>Comments (<span id="commentCount">0</span>)</h2>
                        
                        <!-- Comment Form -->
                        <div class="comment-form">
                            <input type="text" id="commentName" placeholder="Your name">
                            <textarea id="commentText" placeholder="Write a comment..." rows="3"></textarea>
                            <button id="submitComment" class="btn-primary">Post Comment</button>
                        </div>

                        <!-- Comments List -->
                        <div id="commentsList" class="comments-list">
                            <!-- Comments will be loaded here -->
                        </div>
                    </div>
                </div>

                <!-- Sidebar -->
                <aside class="sidebar">
                    <!-- Sidebar Ad -->
                    <div class="ad-sidebar">
                        <div id="sidebarAd" class="ad-placeholder">
                            <!-- Ad will be loaded here -->
                        </div>
                    </div>

                    <!-- Related Videos -->
                    <div class="related-videos">
                        <h3>Related Videos</h3>
                        <div id="relatedVideosList" class="related-list">
                            <!-- Related videos will be loaded here -->
                        </div>
                    </div>
                </aside>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <p>&copy; 2026 Xhavan. All rights reserved.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="script.js"></script>
</body>
</html>
